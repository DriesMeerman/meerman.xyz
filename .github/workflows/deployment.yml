name: Build and publish

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Serialize production updates instead of replacing the same container concurrently.
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: chrozera/meerman.xyz

jobs:
  build-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Npm install
        run: rm package-lock.json && npm install

      - name: Validate blog content
        run: npm run validate:blog

      - name: Test deployment failure handling
        run: node --test tools/deploy/deployment.test.mjs

      - name: Build website
        run: npm run build

      - name: Validate optimized image artifacts
        run: |
          test -d build/g/assets
          find build/g/assets -type f | grep -q .
          test -f build/g/assets/servicenow_logo-400.png
          test -f build/g/assets/logos/realm_db_logo-306.png
          test -f build/sitemap.xml

      - name: Record deployment revision
        run: printf '%s\n' "$GITHUB_SHA" > build/deployment-revision.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meerman-xyz-website
          path: build/

      - name: Save generated lockfile
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 90

  publish-container:
    runs-on: ubuntu-latest
    needs: build-website
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to docker registry
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN}}
        run: printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin

      - uses: actions/download-artifact@v4
        with:
          name: meerman-xyz-website
          path: build

      - name: Build and publish the Docker image
        run: |
          image="$IMAGE_NAME"
          docker build --file Dockerfile.artifact \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:latest" .
          docker run --rm "$image:sha-$GITHUB_SHA" nginx -t
          test "$(docker run --rm --entrypoint cat "$image:sha-$GITHUB_SHA" /usr/share/nginx/html/deployment-revision.txt)" = "$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: publish-container
    steps:
      - uses: actions/checkout@v4

      - name: Deploy the published revision over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          EXPECTED_REVISION: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: IMAGE_REF,EXPECTED_REVISION
          script_path: tools/deploy/deploy-container.sh

      - name: Verify the public site serves this revision
        run: sh tools/deploy/verify-revision.sh https://meerman.xyz "$GITHUB_SHA"
